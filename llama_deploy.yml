name: chat

control-plane:
  port: 8000

default-service: workflow

services:
  workflow:
    name: Workflow
    source:
      type: local
      name: src
    path: src/workflow:workflow
    python-dependencies:
      - llama-index-core>=0.12.45,<0.13.0
      - llama-index-llms-openai>=0.3.2,<0.4.0
      - llama-index-embeddings-fastembed>=0.3.5
      - llama-index-vector-stores-chroma>=0.4.2
      - fastembed>=0.8.0
      - chromadb>=1.5.9

ui:
  name: My Nextjs App
  port: 3000
  source:
    type: local
    name: ui
